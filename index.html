<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education Link</title>
    <meta name="description" content="Access education resources and learning portal." />
    <meta property="og:title" content="Education Link" />
    <meta property="og:description" content="Access education resources and learning portal." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 selection:bg-cyan-500 selection:text-white">
    <main class="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-2xl p-8 sm:p-10 shadow-2xl flex flex-col items-center text-center opacity-0 translate-y-4 transition-all duration-500 ease-out" id="main-content">
      <div class="w-14 h-14 rounded-xl bg-slate-800 border border-slate-700/80 flex items-center justify-center mb-6 text-sky-400 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </div>

      <h1 class="text-xl sm:text-2xl font-semibold tracking-tight text-slate-100 leading-relaxed mb-8">
        link to education
      </h1>

      <div class="w-full flex justify-center">
        <a 
          href="http://frosted-poop.duckdns.org" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="inline-flex items-center justify-center gap-2 px-8 py-3 rounded-xl bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950 font-medium text-sm transition-colors duration-150 shadow-md group"
        >
          <span>start learning</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </a>
      </div>
    </main>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const main = document.getElementById('main-content');
        setTimeout(() => {
          main.classList.remove('opacity-0', 'translate-y-4');
          main.classList.add('opacity-100', 'translate-y-0');
        }, 100);
      });
    </script>
  </body>
</html>
